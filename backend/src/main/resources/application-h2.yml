spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:docminddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
