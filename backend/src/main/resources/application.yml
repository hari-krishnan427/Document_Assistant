server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  application:
    name: docmind-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docmind_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: 9a6e8b1c4d7f2e5a8b3c1d9e4f7a2b5c8d1e4f7a0b3c6d9e2f5a8b1c4d7f2e5a
    expiration-ms: 86400000 # 24 Hours
  upload:
    dir: uploads
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.docmind: DEBUG
    org.springframework.security: INFO
